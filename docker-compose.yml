version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: music_platform_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: music_platform
      MYSQL_USER: ${DB_USER:-music_user}
      MYSQL_PASSWORD: ${DB_PASS:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  mysql_data:
    driver: local
