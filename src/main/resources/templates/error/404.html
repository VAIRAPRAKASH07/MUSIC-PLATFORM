<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::content})}">
<head>
    <title>Page Not Found - 404</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-12 col-md-8 col-lg-6 text-center">
            <div class="custom-card p-5 shadow-lg">
                <i class="bi bi-music-note-list text-warning" style="font-size: 4rem;"></i>
                <h1 class="fw-bold mt-3">404 - Resource Not Found</h1>
                <p class="text-secondary mb-4" th:text="${message != null ? message : 'The song, playlist, or page you are looking for does not exist or has been removed.'}">
                    The requested resource could not be found.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/songs}" class="btn btn-primary-custom px-4"><i class="bi bi-music-note-beamed me-1"></i> Browse Songs</a>
                    <a th:href="@{/playlists}" class="btn btn-outline-light px-4">My Playlists</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
