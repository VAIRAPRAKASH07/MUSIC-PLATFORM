<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::content})}">
<head>
    <title>Access Forbidden - 403</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-12 col-md-8 col-lg-6 text-center">
            <div class="custom-card p-5 shadow-lg">
                <i class="bi bi-shield-lock-fill text-danger" style="font-size: 4rem;"></i>
                <h1 class="fw-bold mt-3">403 - Access Forbidden</h1>
                <p class="text-secondary mb-4" th:text="${message != null ? message : 'You do not have permission to perform this action or view this resource.'}">
                    You do not have permission to perform this action.
                </p>
                <div class="d-flex justify-content-center gap-3">
                    <a th:href="@{/songs}" class="btn btn-primary-custom px-4"><i class="bi bi-house me-1"></i> Back to Songs</a>
                    <a th:href="@{/playlists}" class="btn btn-outline-light px-4">My Playlists</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
