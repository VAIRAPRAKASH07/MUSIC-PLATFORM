<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout/base :: html(~{::content})}">
<head>
    <title th:text="${playlist.name + ' - BeatStream'}">Playlist Details</title>
</head>
<body>
<div th:fragment="content">
    <div class="mb-3">
        <a th:href="@{/playlists}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i> Back to Playlists</a>
    </div>

    <!-- Playlist Header Banner -->
    <div class="custom-card p-4 p-md-5 mb-4">
        <div class="d-flex flex-column flex-md-row align-items-center gap-4">
            <div class="rounded-3 p-4 bg-dark d-flex align-items-center justify-content-center text-success border border-secondary"
                 th:classappend="${playlist.systemPlaylist ? 'favourites-cover text-white' : ''}"
                 style="width: 140px; height: 140px;">
                <i th:class="${playlist.systemPlaylist ? 'bi bi-heart-fill fs-1' : 'bi bi-music-note-list fs-1'}"></i>
            </div>
            <div class="text-center text-md-start flex-grow-1">
                <div class="d-flex align-items-center justify-content-center justify-content-md-start gap-2 mb-1">
                    <span class="badge" th:classappend="${playlist.systemPlaylist ? 'bg-danger' : 'bg-secondary'}"
                          th:text="${playlist.systemPlaylist ? 'System Playlist' : 'Custom Playlist'}">Playlist</span>
                    <span class="text-secondary small" th:text="${playlist.songCount + ' songs • ' + playlist.formattedTotalDuration}">0 songs • 0:00</span>
                </div>
                <h1 class="fw-bold mb-2" th:text="${playlist.name}">Playlist Title</h1>
                <p class="text-secondary mb-3" th:text="${playlist.description != null and !playlist.description.isBlank() ? playlist.description : 'No description provided.'}">Description</p>

                <div class="d-flex flex-wrap align-items-center justify-content-center justify-content-md-start gap-2">
                    <!-- Play Playlist -->
                    <button class="btn btn-primary-custom btn-play-playlist" th:data-playlist-id="${playlist.id}" data-shuffle="false"
                            th:disabled="${playlist.songCount == 0}">
                        <i class="bi bi-play-fill me-1"></i> Play Playlist
                    </button>
                    <!-- Shuffle & Play (Fisher-Yates) -->
                    <button class="btn btn-outline-success rounded-pill px-3 btn-play-playlist" th:data-playlist-id="${playlist.id}" data-shuffle="true"
                            th:disabled="${playlist.songCount == 0}">
                        <i class="bi bi-shuffle me-1"></i> Shuffle Play
                    </button>

                    <!-- Rename / Edit (Only if NOT system playlist) -->
                    <a th:if="${!playlist.systemPlaylist}" th:href="@{/playlists/{id}/edit(id=${playlist.id})}" class="btn btn-outline-secondary rounded-pill px-3">
                        <i class="bi bi-pencil me-1"></i> Rename
                    </a>

                    <!-- Delete Playlist (Only if NOT system playlist) -->
                    <form th:if="${!playlist.systemPlaylist}" th:action="@{/playlists/{id}/delete(id=${playlist.id})}" method="post" class="d-inline"
                          onsubmit="return confirm('Are you sure you want to delete this playlist? The songs themselves will not be deleted.');">
                        <button type="submit" class="btn btn-outline-danger rounded-pill px-3">
                            <i class="bi bi-trash me-1"></i> Delete
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Tracks Table -->
    <div class="custom-card overflow-hidden">
        <div class="p-3 border-bottom border-secondary d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0">Tracks (<span th:text="${playlist.songCount}">0</span>)</h5>
            <a th:href="@{/songs}" class="btn btn-sm btn-outline-light rounded-pill px-3">
                <i class="bi bi-plus me-1"></i> Browse Catalog to Add Songs
            </a>
        </div>
        <div class="table-responsive">
            <table class="table table-custom mb-0">
                <thead>
                <tr>
                    <th style="width: 50px;">#</th>
                    <th style="width: 80px;" class="text-center">Reorder</th>
                    <th style="width: 50px;"></th>
                    <th style="width: 40px;"></th>
                    <th>Title</th>
                    <th>Artist</th>
                    <th>Album</th>
                    <th>Duration</th>
                    <th style="width: 60px;" class="text-end"></th>
                </tr>
                </thead>
                <tbody>
                <!-- Empty State -->
                <tr th:if="${playlistSongs.empty}">
                    <td colspan="9" class="text-center py-5 text-secondary">
                        <i class="bi bi-disc fs-1 mb-2 d-block"></i>
                        <h5>This playlist has no songs yet</h5>
                        <p class="small mb-3">Browse our song catalog and click "Add to Playlist" on any track.</p>
                        <a th:href="@{/songs}" class="btn btn-sm btn-primary-custom">Browse Songs</a>
                    </td>
                </tr>

                <!-- Tracks -->
                <tr th:each="ps, iterStat : ${playlistSongs}">
                    <!-- Position -->
                    <td class="text-secondary fw-semibold" th:text="${ps.position}">1</td>

                    <!-- Up / Down Reorder Buttons -->
                    <td class="text-center">
                        <div class="btn-group btn-group-sm" role="group">
                            <!-- Move Up -->
                            <form th:action="@{/playlists/{id}/songs/{songId}/move(id=${playlist.id}, songId=${ps.songId})}" method="post" class="d-inline">
                                <input type="hidden" name="direction" value="up"/>
                                <button type="submit" class="btn btn-sm btn-outline-secondary p-1"
                                        th:disabled="${iterStat.first}" title="Move Up">
                                    <i class="bi bi-chevron-up"></i>
                                </button>
                            </form>
                            <!-- Move Down -->
                            <form th:action="@{/playlists/{id}/songs/{songId}/move(id=${playlist.id}, songId=${ps.songId})}" method="post" class="d-inline">
                                <input type="hidden" name="direction" value="down"/>
                                <button type="submit" class="btn btn-sm btn-outline-secondary p-1"
                                        th:disabled="${iterStat.last}" title="Move Down">
                                    <i class="bi bi-chevron-down"></i>
                                </button>
                            </form>
                        </div>
                    </td>

                    <!-- Play Track Button -->
                    <td>
                        <button class="btn-play-row btn-play-song" th:data-song-id="${ps.songId}" title="Play Track">
                            <i class="bi bi-play-circle-fill"></i>
                        </button>
                    </td>

                    <!-- Heart Favourite Button -->
                    <td>
                        <button class="btn-heart" th:classappend="${ps.favourited ? 'active' : ''}"
                                th:data-song-id="${ps.songId}" title="Toggle Favourite">
                            <i th:class="${ps.favourited ? 'bi bi-heart-fill' : 'bi bi-heart'}"></i>
                        </button>
                    </td>

                    <!-- Title -->
                    <td>
                        <a th:href="@{/songs/{id}(id=${ps.songId})}" class="text-light fw-semibold text-decoration-none" th:text="${ps.title}">Title</a>
                    </td>

                    <!-- Artist -->
                    <td class="text-secondary" th:text="${ps.artist}">Artist</td>

                    <!-- Album -->
                    <td class="text-secondary" th:text="${ps.album != null and !ps.album.isBlank() ? ps.album : '-'}">Album</td>

                    <!-- Duration -->
                    <td class="text-secondary" th:text="${ps.formattedDuration}">3:45</td>

                    <!-- Remove Song Button -->
                    <td class="text-end">
                        <form th:action="@{/playlists/{id}/songs/{songId}/remove(id=${playlist.id}, songId=${ps.songId})}" method="post"
                              onsubmit="return confirm('Remove this song from the playlist?');" class="d-inline">
                            <button type="submit" class="btn btn-sm btn-link text-danger p-0" title="Remove from playlist">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
