<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::content})}">
<head>
    <title>Sign In - Music Platform</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-12 col-md-8 col-lg-5 col-xl-4">
            <div class="custom-card p-4 p-sm-5 shadow-lg">
                <div class="text-center mb-4">
                    <i class="bi bi-soundwave brand-icon fs-1"></i>
                    <h2 class="fw-bold mt-2">Welcome Back</h2>
                    <p class="text-secondary small">Sign in to manage your music & playlists</p>
                </div>

                <form th:action="@{/login}" method="post">
                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary small fw-semibold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" placeholder="Enter your username" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text bg-dark border-secondary text-secondary"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="Enter your password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Sign In</button>
                </form>

                <!-- Demo Credentials Quick-Fill Helper -->
                <div class="card bg-dark border-secondary p-3 mt-3">
                    <div class="text-secondary small fw-semibold mb-2"><i class="bi bi-key-fill text-warning me-1"></i> Quick Demo Logins:</div>
                    <div class="d-flex justify-content-between gap-2">
                        <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="fillCredentials('demo_user', 'Password123!')">
                            Demo User
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger w-50" onclick="fillCredentials('admin', 'Password123!')">
                            Admin User
                        </button>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <p class="text-secondary small mb-0">Don't have an account? <a th:href="@{/register}" class="text-success text-decoration-none fw-semibold">Register here</a></p>
                </div>
            </div>
        </div>
    </div>

    <script>
        function fillCredentials(user, pass) {
            document.getElementById('username').value = user;
            document.getElementById('password').value = pass;
        }
    </script>
</div>
</body>
</html>
