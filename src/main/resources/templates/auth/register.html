<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/base :: html(~{::content})}">
<head>
    <title>Create Account - Music Platform</title>
</head>
<body>
<div th:fragment="content">
    <div class="row justify-content-center align-items-center" style="min-height: 70vh;">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="custom-card p-4 p-sm-5 shadow-lg">
                <div class="text-center mb-4">
                    <i class="bi bi-soundwave brand-icon fs-1"></i>
                    <h2 class="fw-bold mt-2">Create Account</h2>
                    <p class="text-secondary small">Join BeatStream to create playlists and discover music</p>
                </div>

                <form th:action="@{/register}" th:object="${userDto}" method="post">
                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label text-secondary small fw-semibold">Username</label>
                        <input type="text" class="form-control bg-dark text-light border-secondary"
                               id="username" th:field="*{username}" placeholder="Choose a username (3-50 chars)"
                               th:classappend="${#fields.hasErrors('username') ? 'is-invalid' : ''}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('username')}" th:errors="*{username}">Username error</div>
                    </div>

                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label text-secondary small fw-semibold">Email Address</label>
                        <input type="email" class="form-control bg-dark text-light border-secondary"
                               id="email" th:field="*{email}" placeholder="name@example.com"
                               th:classappend="${#fields.hasErrors('email') ? 'is-invalid' : ''}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">Email error</div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label text-secondary small fw-semibold">Password</label>
                        <input type="password" class="form-control bg-dark text-light border-secondary"
                               id="password" th:field="*{password}" placeholder="At least 6 characters"
                               th:classappend="${#fields.hasErrors('password') ? 'is-invalid' : ''}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="mb-4">
                        <label for="confirmPassword" class="form-label text-secondary small fw-semibold">Confirm Password</label>
                        <input type="password" class="form-control bg-dark text-light border-secondary"
                               id="confirmPassword" th:field="*{confirmPassword}" placeholder="Repeat password"
                               th:classappend="${#fields.hasErrors('confirmPassword') ? 'is-invalid' : ''}" required>
                        <div class="invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}">Password error</div>
                    </div>

                    <button type="submit" class="btn btn-primary-custom w-100 py-2 mb-3">Register</button>
                </form>

                <div class="text-center mt-3">
                    <p class="text-secondary small mb-0">Already have an account? <a th:href="@{/login}" class="text-success text-decoration-none fw-semibold">Sign in here</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
