<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="html(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}"/>
    <title th:text="${title != null ? title + ' - Music Platform' : 'Music Platform - Streaming & Playlist Manager'}">Music Platform</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 CDN & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <!-- Custom Modern Dark CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container-fluid px-4">
        <a class="navbar-brand" th:href="@{/songs}">
            <i class="bi bi-soundwave brand-icon"></i>
            <span>BeatStream</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContent" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/songs}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/songs') ? 'active' : ''}">
                        <i class="bi bi-music-note-beamed me-1"></i> Songs
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/playlists}" th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/playlists' ? 'active' : ''}">
                        <i class="bi bi-collection-play me-1"></i> Playlists
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/playlists/favourites}" th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/playlists/favourites') ? 'active' : ''}">
                        <i class="bi bi-heart-fill text-danger me-1"></i> Favourites
                    </a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <div sec:authorize="isAuthenticated()" class="d-flex align-items-center gap-3">
                    <a th:href="@{/songs/new}" class="btn btn-sm btn-outline-success rounded-pill px-3">
                        <i class="bi bi-plus-circle me-1"></i> Add Song
                    </a>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-outline-secondary dropdown-toggle rounded-pill px-3" type="button" id="userMenuBtn" data-bs-toggle="dropdown" aria-expanded="false">
                            <i class="bi bi-person-circle me-1"></i>
                            <span sec:authentication="name">User</span>
                            <span sec:authorize="hasRole('ADMIN')" class="badge bg-danger ms-1">ADMIN</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-dark dropdown-menu-end shadow" aria-labelledby="userMenuBtn">
                            <li><a class="dropdown-item" th:href="@{/playlists}"><i class="bi bi-collection me-2"></i>My Playlists</a></li>
                            <li><a class="dropdown-item" th:href="@{/playlists/favourites}"><i class="bi bi-heart me-2"></i>My Favourites</a></li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="m-0">
                                    <button type="submit" class="dropdown-item text-danger">
                                        <i class="bi bi-box-arrow-right me-2"></i>Sign Out
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>
                </div>

                <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-2">
                    <a th:href="@{/login}" class="btn btn-sm btn-outline-light rounded-pill px-3">Sign In</a>
                    <a th:href="@{/register}" class="btn btn-sm btn-primary-custom">Register</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main Container -->
<main class="container-fluid px-4 py-4">
    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${successMessage}">Success message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show shadow-sm" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${errorMessage}">Error message</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>

    <!-- Page Specific Body Content -->
    <div th:replace="${content}">
        <p>Default content</p>
    </div>
</main>

<!-- Simulated Bottom Player Bar -->
<div class="bottom-player-bar" id="playerBar">
    <div class="player-track-info">
        <div class="player-track-cover" id="playerTrackCover">
            <i class="bi bi-music-note"></i>
        </div>
        <div class="overflow-hidden">
            <div class="player-track-title" id="playerTrackTitle">No track playing</div>
            <div class="player-track-artist" id="playerTrackArtist">Select a track to start playback</div>
        </div>
    </div>

    <div class="player-center-controls">
        <div class="player-buttons">
            <button class="player-btn" id="playerPrevBtn" title="Previous Track">
                <i class="bi bi-skip-start-fill"></i>
            </button>
            <button class="player-btn player-btn-main" id="playerPlayPauseBtn" title="Play / Pause">
                <i class="bi bi-play-fill" id="playerPlayPauseIcon"></i>
            </button>
            <button class="player-btn" id="playerNextBtn" title="Next Track">
                <i class="bi bi-skip-end-fill"></i>
            </button>
        </div>
        <div class="player-progress-container">
            <span class="player-time" id="playerCurrentTime">0:00</span>
            <div class="player-progress-bar" id="playerProgressBar" title="Click to seek">
                <div class="player-progress-fill" id="playerProgressFill"></div>
            </div>
            <span class="player-time text-end" id="playerTotalTime">0:00</span>
        </div>
    </div>

    <div class="player-right-controls">
        <button class="btn btn-sm btn-outline-secondary position-relative rounded-pill px-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#queueDrawer" aria-controls="queueDrawer">
            <i class="bi bi-music-note-list me-1"></i> Queue
            <span class="badge bg-success rounded-pill ms-1" id="queueBadge">0</span>
        </button>
    </div>
</div>

<!-- Queue Offcanvas Drawer -->
<div class="offcanvas offcanvas-end offcanvas-dark" tabindex="-1" id="queueDrawer" aria-labelledby="queueDrawerLabel">
    <div class="offcanvas-header border-bottom border-secondary">
        <h5 class="offcanvas-title" id="queueDrawerLabel"><i class="bi bi-music-note-list me-2"></i>Play Queue</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="text-secondary small">Upcoming Tracks</span>
            <button class="btn btn-sm btn-outline-danger" onclick="Player.clearQueue()">Clear Queue</button>
        </div>
        <div id="queueList">
            <!-- Dynamic queue list populated by player.js -->
        </div>
    </div>
</div>

<!-- Add to Playlist Modal (Reusable) -->
<div class="modal fade" id="addToPlaylistModal" tabindex="-1" aria-labelledby="addToPlaylistModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content bg-dark text-light border-secondary">
            <div class="modal-header border-secondary">
                <h5 class="modal-title" id="addToPlaylistModalLabel"><i class="bi bi-plus-circle me-2"></i>Add Song to Playlist</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body" id="modalPlaylistsContainer">
                <!-- Injected via helper or forms -->
                <p class="text-secondary small">Select one of your playlists:</p>
                <div class="list-group list-group-flush" id="modalPlaylistsList"></div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 Bundle JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Custom App & Player JS -->
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/favourites.js}"></script>
<script th:src="@{/js/player.js}"></script>
</body>
</html>
