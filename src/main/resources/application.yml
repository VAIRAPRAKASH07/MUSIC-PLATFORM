spring:
  application:
    name: musicplatform
  profiles:
    active: dev

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    # If DB_URL is set (e.g. in .env), connects to MySQL; otherwise defaults to H2 in MySQL mode for instant local review
    url: ${DB_URL:jdbc:h2:mem:music_platform;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1}
    username: ${DB_USER:sa}
    password: ${DB_PASS:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/seed
    baseline-on-migrate: true
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}
